<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_blank">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Tahoma, "MS Sans Serif", sans-serif;
      font-size: 11px;
      color: #dfd4b1;
    }
    #gfdkris {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    table {
      margin: 0 auto;
    }
    a {
      color: #ecd792;
    }
    a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id='gfdkris'> 
    <script type="text/javascript" src="https://fabstarotcorner.neocities.org/webring/onionring-variables.js"></script>
    <script type="text/javascript" src="https://fabstarotcorner.neocities.org/webring/onionring-widget.js"></script>
  </div>

  <script>
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (a && a.href) {
        e.preventDefault();
        window.open(a.href, '_blank');
      }
    }, true);
  </script>
</body>
</html>

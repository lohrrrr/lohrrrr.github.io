<div class="explorer-wrapper" id="exp-root">
  <div class="exp-toolbar">
    <div class="exp-nav-actions">
      <button class="exp-btn" id="exp-btn-back" title="Back">🠔</button>
      <button class="exp-btn" id="exp-btn-up" title="Up">🠕</button>
      <button class="exp-btn" id="exp-btn-refresh" title="Refresh">⟳</button>
    </div>
    <div class="exp-address-box">
      <span class="exp-address-label">Address:</span>
      <input type="text" id="exp-address" spellcheck="false" autocomplete="off">
      <button class="exp-btn" id="exp-btn-go">Go</button>
    </div>
  </div>

  <div class="exp-main">
    <div class="exp-sidebar">
      <div class="exp-side-title">Places</div>
      <div class="exp-side-link" data-target="/home/guest/Desktop">
        <span class="exp-side-icon">🖥️</span>
        <span>Desktop</span>
      </div>
      <div class="exp-side-link" data-target="/home/guest">
        <span class="exp-side-icon">🏠</span>
        <span>Home (~/guest)</span>
      </div>
      <div class="exp-side-link" data-target="/home/lohrrrr">
        <span class="exp-side-icon">👤</span>
        <span>lohrrrr</span>
      </div>
      <div class="exp-side-link" data-target="/filesystem/Apps">
        <span class="exp-side-icon">📦</span>
        <span>Apps</span>
      </div>
      <div class="exp-side-link" data-target="/filesystem/bin">
        <span class="exp-side-icon">⚙️</span>
        <span>Binaries (/bin)</span>
      </div>
      <div class="exp-side-link" data-target="/">
        <span class="exp-side-icon">💾</span>
        <span>Root (/)</span>
      </div>
    </div>

    <div class="exp-content">
      <div class="exp-grid" id="exp-grid"></div>
    </div>
  </div>

  <div class="exp-picker-bar" id="exp-picker-bar" style="display: none;">
    <div class="exp-picker-row">
      <span class="exp-picker-label">File name:</span>
      <input type="text" id="exp-picker-name" class="exp-picker-input" spellcheck="false" autocomplete="off">
      <button class="exp-btn" id="exp-picker-action-btn">Save</button>
      <button class="exp-btn" id="exp-picker-cancel-btn">Cancel</button>
    </div>
  </div>

  <div class="exp-statusbar">
    <span id="exp-status-count">0 object(s)</span>
    <span id="exp-status-perm">Permissions: Read-Only</span>
  </div>

  <div class="exp-viewer" id="exp-viewer" style="display: none;">
    <div class="exp-viewer-head">
      <span id="exp-viewer-title">view</span>
      <button id="exp-viewer-close">✕</button>
    </div>
    <pre id="exp-viewer-body"></pre>
  </div>
</div>

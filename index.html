<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASTERPOS v2.40 [GOLD EDITION] - lohrrrr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-overlay"></div>

  <div id="desktop">
    <div id="icon-grid"></div>
    <div id="window-space"></div>

    <div id="start-menu" style="display: none;">
      <div class="start-header">
        <div class="start-avatar">❖</div>
        <div class="start-username">lohrrrr</div>
      </div>

      <div class="start-body">
        <div class="start-col start-col-left" id="start-app-list"></div>

        <div class="start-col start-col-right">
          <a href="https://github.com/lohrrrr" target="_blank" class="start-item-link">
            <span class="start-item-icon">🐙</span>
            <span class="start-item-title">GitHub Profile</span>
          </a>
          <div class="start-divider"></div>
          <div class="start-item" id="start-term-btn">
            <span class="start-item-icon">📟</span>
            <div class="start-item-details">
              <span class="start-item-title">Terminal Emulator</span>
              <span class="start-item-desc">Run scripts and tools</span>
            </div>
          </div>
        </div>
      </div>

      <div class="start-footer">
        <button class="start-foot-btn" id="start-shutdown-btn">
          <span class="foot-icon">🛑</span> Выключение
        </button>
      </div>
    </div>
  </div>

  <div id="taskbar">
    <div id="start-btn">
      <span class="start-flag">❖</span>
      <span class="start-txt">Пуск</span>
    </div>

    <div class="task-buttons" id="task-buttons"></div>

    <div id="tray">
      <div class="tray-icon" id="tray-volume" title="Volume: 40%">🔊 40%</div>
      <div class="tray-icon" title="Network LAN 100M">🖧 LAN</div>
      <div id="clock">00:00:00</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
